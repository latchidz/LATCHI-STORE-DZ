# --- Build tuning ---
# Codemagic linux_x2 = 8 GB RAM. 4 GB heap is safe and fast.
# (The Arena sandbox only has 1.9 GB which is why local AGP builds OOM there.)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
